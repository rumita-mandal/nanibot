services:
  postgres:
    image: postgres:16-alpine
    container_name: nanibot_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nanibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanibot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nanibot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanibot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nanibot_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nanibot}:${POSTGRES_PASSWORD:-nanibot_secret}@postgres:5432/${POSTGRES_DB:-nanibot_db}
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run python -m app.data.seed &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nanibot_frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  chroma_data:
  uploads_data:
